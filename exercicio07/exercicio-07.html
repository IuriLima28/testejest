<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consumo de Combustível</title>
</head>
<body>

<h2>Calculadora de Consumo de Combustível</h2>

<label>Distância percorrida (km):</label>
<input type="number" id="distancia">

<label>Combustível consumido (litros):</label>
<input type="number" id="combustivel">

<label>Combustível para estimativa (opcional):</label>
<input type="number" id="estimativa">

<button
  onclick="
    const d = Number(document.getElementById('distancia').value);
    const c = Number(document.getElementById('combustivel').value);
    const e = Number(document.getElementById('estimativa').value) || undefined;
    const r = calcularConsumo(d, c, e);
    alert(
      'Distância: ' + r.distanciaKm + ' km\n' +
      'Combustível gasto: ' + r.combustivelLitros + ' L\n' +
      'Consumo médio: ' + r.consumoMedio.toFixed(2) + ' km/L' +
      (r.autonomiaEstimada !== undefined ? '\nAutonomia estimada: ' + r.autonomiaEstimada.toFixed(2) + ' km' : '')
    );
  "
>Calcular</button>

<!-- Linka seu JS -->
<script src="exercicio-07.js"></script>

</body>
</html>
